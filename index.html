<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LCN – Liberty City National Exchange · Coming soon</title>
<meta name="description" content="The stock exchange of the GTA universe. Invest in the biggest companies of Liberty City, Los Santos and Vice City with $SOL. Coming soon.">
<link rel="icon" href="lcn.png">
<link rel="apple-touch-icon" href="lcn.png">
<meta property="og:title" content="LCN – Liberty City National Exchange">
<meta property="og:description" content="The stock exchange of the GTA universe. Invest in the biggest companies with $SOL. Coming soon.">
<meta property="og:image" content="https://lcnpad.netlify.app/lcn.png">
<meta property="og:url" content="https://lcnpad.netlify.app/">
<meta name="twitter:card" content="summary">
<meta name="twitter:site" content="@LCNpad">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #3359c6; color: #fff; font-family: Inter, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .arch { font-family: Archivo, sans-serif; font-style: italic; font-weight: 900; }
  main { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 20px 40px; gap: 18px; }
  .logo { width: 230px; height: 230px; margin: -30px 0 -20px; }
  .name { font-size: clamp(26px, 5vw, 46px); letter-spacing: 1px; line-height: 1.05; }
  .sub { font-family: Archivo, sans-serif; font-style: italic; font-weight: 800; font-size: clamp(13px, 2vw, 18px); letter-spacing: 12px; padding-left: 12px; margin-top: -8px; }
  .soon { display: inline-block; background: #fff; color: #13308f; font-size: clamp(30px, 7vw, 64px); padding: 12px 36px; box-shadow: 0 8px 0 #d0021b; margin: 22px 0 12px; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
  .tag { max-width: 620px; font-size: clamp(16px, 2.2vw, 20px); line-height: 1.55; color: #e3eaff; margin: 0; }
  .companies { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px 0 6px; max-width: 640px; }
  .companies img { width: 52px; height: 52px; object-fit: cover; border: 2px solid rgba(255,255,255,.85); background: #fff; }
  .x { display: inline-flex; align-items: center; gap: 12px; background: #000; color: #fff; font-weight: 700; font-size: 17px; padding: 15px 26px; min-height: 52px; box-shadow: 0 5px 0 rgba(0,0,0,.3); margin-top: 8px; }
  .x:hover { background: #222; }
  .ticker { background: #fff; color: #141414; border-top: 5px solid #d0021b; overflow: hidden; padding: 14px 0; }
  .track { display: flex; gap: 44px; width: max-content; white-space: nowrap; font-size: 20px; font-weight: 600; animation: scroll 36s linear infinite; }
  .track span b { color: #1a7a24; }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  footer { background: #1c1c1c; height: 14px; }
  @media (prefers-reduced-motion: reduce) { .soon, .track { animation: none; } }
  @media (max-width: 480px) { .logo { width: 170px; height: 170px; } .companies img { width: 42px; height: 42px; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="lcn.png" alt="LCN">
  <div class="name arch">LIBERTY CITY NATIONAL</div>
  <div class="sub">EXCHANGE</div>
  <div class="soon arch">COMING SOON</div>
  <p class="tag">The stock exchange of the GTA universe. Buy and sell shares of the biggest companies of Liberty City, Los Santos and Vice City with $SOL. Every share lives on-chain.</p>
  <div class="companies" aria-label="Companies listing on LCN">
    <img src="app/logos/burger.png" alt="Burger Shot">
    <img src="app/logos/ecola.png" alt="eCola">
    <img src="app/logos/sprunk.png" alt="Sprunk">
    <img src="app/logos/cluck.png" alt="Cluckin' Bell">
    <img src="app/logos/fleeca.png" alt="Fleeca Bank">
    <img src="app/logos/ammu.png" alt="Ammu-Nation">
    <img src="app/logos/audacity.png" alt="AudaCity">
    <img src="app/logos/nine1nine.png" alt="NINE1NINE">
    <img src="app/logos/orr.png" alt="Only Raw Records">
  </div>
  <a class="x" href="https://x.com/LCNpad" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.75 3h3.07l-6.7 7.66L22 21h-6.17l-4.83-6.32L5.47 21H2.4l7.17-8.2L2 3h6.33l4.37 5.77L17.75 3zm-1.08 16.2h1.7L7.4 4.73H5.58L16.67 19.2z"/></svg>
    Follow @LCNpad for the launch
  </a>
</main>

<div class="ticker" aria-hidden="true">
  <div class="track" id="track"></div>
</div>
<footer aria-hidden="true"></footer>

<script>
(function () {
  var names = ['BURGER', 'ECOLA', 'SPRUNK', 'CLUCK', 'FLEECA', 'AMMU', 'AUDACITY', 'NINE1NINE', 'ORR'];
  var one = names.map(function (n) { return '<span>' + n + ' <b>▲ SOON</b></span>'; }).join('');
  document.getElementById('track').innerHTML = one + one;
})();
</script>
</body>
</html>
